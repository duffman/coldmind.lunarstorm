[package]
name = "lunarstorm-event-loop-runtime"
version = "0.1.0"
edition = "2021"
description = "The Lunarstorm Runtime: event loop, timers, modules, fs and net, generic over the VM and the host"

[dependencies]
lunarstorm-engine-contract = { path = "../engine-contract" }
# Extension names, manifest and load-time checks, shared with the platform level.
lunar-extension = { path = "../../extensions/core" }
# Files and packages as ES modules: TypeScript, JSON, CommonJS, package.json.
lunarstorm-module-sources = { path = "../module-sources" }
# Signed .jbn packages: built from a module graph, run as bytecode.
lunarstorm-jbn-package-format = { path = "../jbn-package-format" }
mio = { version = "1.2", default-features = false, features = ["os-poll", "net"] }
crossbeam-channel = "0.5"
bytes = "1"
slab = "0.4"
# HTTP/1.1 framing lives in its own reusable crate (crates/http1).
lunarstorm-http1 = { path = "../../crates/http1" }
libc = "0.2"

[dev-dependencies]
# Tests need a real engine; the library itself names none.
lunarstorm-engine-quickjs-adapter = { path = "../engine-quickjs-adapter" }
tempfile.workspace = true
