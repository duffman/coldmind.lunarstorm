[package]
name = "module-loader"
version = "0.14.0"
authors = ["K. <kayo@illumium.org>"]
edition = "2018"
publish = false

[dependencies.rquickjs]
path = "../.."
default-features = false
# lunarstorm patch: no `rust-alloc`. These examples are workspace members, so the
# feature was unified into every engine of a workspace build and routed QuickJS's
# malloc through the Rust global allocator there, which no Lunarstorm build does
# (lunarstorm-debug's allocation-failure tests then failed only under
# `cargo test --workspace`). The examples run the same on the libc allocator.
features = ["futures", "loader", "dyn-load", "std"]

[features]
default = ["macro"]
macro = ["rquickjs/macro"]
