# The `lunarstation` binary: a second command line on the CLI host
# (crates/cli-host), next to `lunar` (apps/lunarstorm).
#
# Decision: it mounts the same packages as `lunar`, behind the same one-feature-per-
# package switches, so `cargo build -p lunarstation --no-default-features --features
# build` gives a `lunarstation` with only `build`. Its own commands go in as one more
# package: an optional dependency, a feature, and one `.package(...)` line in
# `src/main.rs`.
[package]
name = "lunarstation"
version = "0.1.0"
edition = "2021"
publish = false
description = "Lunarstation command line: the Lunarstorm packages mounted on the CLI host under its own name"

[[bin]]
name = "lunarstation"
path = "src/main.rs"

[features]
default = ["runtime", "build", "frontend", "project"]
# `run`: scripts on the Lunarstorm runtime (runtime/hosts/cli).
runtime = ["dep:lunarstorm-host-cli"]
# `build`: the desktop build pipeline (toolchain/crates/pipeline).
build = ["dep:lunarstorm-pipeline"]
# `serve`, `bundle`, `preview`, `transpile`: the frontend tools (toolchain/crates/cli).
frontend = ["dep:devtools-cli"]
# `project init`, `insight`, `compile`, `sign` (platform/extensions/project).
project = ["dep:lunarstorm-project"]

[dependencies]
lunarstorm-cli-host = { path = "../../crates/cli-host" }
lunarstorm-host-cli = { path = "../../runtime/hosts/cli", optional = true }
lunarstorm-pipeline = { path = "../../toolchain/crates/pipeline", optional = true }
devtools-cli = { path = "../../toolchain/crates/cli", optional = true }
lunarstorm-project = { path = "../extensions/project", optional = true }
