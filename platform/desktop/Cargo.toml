# The Lunarstorm platform's native desktop process (spec section 6).
#
# One library holds what both runtimes share; the binaries are thin:
#   lunarstorm-debug    debug runtime: embedded pipeline, file watcher, in-memory asset store
#   lunarstorm-release  release runtime: serves the archive attached to its own executable
#
# The app's backend runs on the desktop app host (`runtime/host-desktop-backend`), i.e. on the
# Lunarstorm Runtime; this crate never touches the JS engine itself.
#
# Release builds use the `platform` profile (root Cargo.toml), not `release`: the
# pipeline boundary and the native worker pool catch panics, which `panic = "abort"`
# in `release` would turn into process aborts.
[package]
name = "lunarstorm-platform"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lunarstorm platform: native desktop process, debug and release runtimes"

[lib]
name = "lunarstorm_platform"
path = "src/lib.rs"

[[bin]]
name = "lunarstorm-debug"
path = "src/bin/debug.rs"

[[bin]]
name = "lunarstorm-release"
path = "src/bin/release.rs"

[features]
# `devtools` turns on WebView devtools; the debug runtime is built with it (6.3).
default = ["devtools"]
devtools = ["wry/devtools"]

[dependencies]
lunarstorm-host-desktop-backend = { path = "../../runtime/host-desktop-backend" }
tao = "0.37"
wry = "0.57"
muda = "0.20"
tray-icon = "0.25"
rfd = "0.17"
arboard = "3.7"
notify-rust = "4.18"
dirs = "6"
open = "5.4"
notify = "8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
