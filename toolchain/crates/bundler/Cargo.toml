[package]
name = "devtools_bundler"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Production frontend bundling for Devtools, independent of desktop hosts"

[dependencies]
devtools_core = { path = "../core" }
rolldown = "=1.3.1"
rolldown_common = "=1.3.1"
rolldown_plugin = "=1.3.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "process", "io-util"] }
serde_json = "1"
anyhow = "1"
