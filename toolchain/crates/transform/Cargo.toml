[package]
name = "devtools-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
publish = false
description = "Shared source transform engine with optional Bun native bindings"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = []
# Disable for Rust/Tauri hosts: no Node-API symbols or Bun runtime required.
bun = ["dep:bun-native-plugin", "dep:napi", "dep:napi-derive", "dep:napi-build"]

[dependencies]
bun-native-plugin = { version = "=0.2.0", optional = true }
napi = { version = "3.14.2", default-features = false, features = ["napi4"], optional = true }
napi-derive = { version = "3.6.12", optional = true }
oxc_allocator = "=0.157.0"
oxc_ast = "=0.157.0"
oxc_ast_visit = "=0.157.0"
oxc_parser = "=0.157.0"
oxc_semantic = "=0.157.0"
oxc_span = "=0.157.0"
oxc_syntax = "=0.157.0"

[build-dependencies]
napi-build = { version = "2.6.0", optional = true }
