[package]
name = "tauri-plugin-devtools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Tauri host for Devtools source transforms and embedded development frontend"
links = "tauri-plugin-devtools"

[features]
default = ["plugin"]
plugin = ["dep:tauri", "dep:serde", "dep:devtools-native", "dep:axum"]
dev-server = ["plugin", "dep:devtools_server"]
# Compatibility library export only. The sole executable lives in crates/cli.
bundler = ["dep:devtools_bundler"]

[dependencies]
axum = { version = "0.8", optional = true }
tauri = { version = "2", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
devtools-native = { path = "../transform", default-features = false, optional = true }
devtools_server = { path = "../server", optional = true }
devtools_bundler = { path = "../bundler", optional = true }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
serde_json = "1"
tauri = { version = "2", default-features = false, features = ["test"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time"] }
tempfile.workspace = true
