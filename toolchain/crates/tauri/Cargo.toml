[package]
name = "tauri-plugin-devermind"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Tauri host for Devermind source transforms and embedded development frontend"
links = "tauri-plugin-devermind"

[features]
default = ["plugin"]
plugin = ["dep:tauri", "dep:serde", "dep:devermind-native", "dep:axum"]
dev-server = ["plugin", "dep:devermind_server"]
# Compatibility library export only. The sole executable lives in crates/cli.
bundler = ["dep:devermind_bundler"]

[dependencies]
axum = { version = "0.8", optional = true }
tauri = { version = "2", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
devermind-native = { path = "../transform", default-features = false, optional = true }
devermind_server = { path = "../server", optional = true }
devermind_bundler = { path = "../bundler", optional = true }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
serde_json = "1"
tauri = { version = "2", default-features = false, features = ["test"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time"] }
tempfile.workspace = true
