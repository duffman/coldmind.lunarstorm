# The build pipeline after model extraction (spec 4b-4e). Its own crate because the
# same library is linked into the CLI and the debug runtime (spec 4).
[package]
name = "lunarstorm-pipeline"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Build pipeline: host configuration, bridge table, frontend and backend generation from the model"

[lib]
name = "lunarstorm_pipeline"

[dependencies]
lunarstorm-model = { path = "../model" }
serde_json = { workspace = true, features = ["preserve_order"] }
rolldown = "=1.3.1"
rolldown_common = "=1.3.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "lunarstorm-build"
path = "src/main.rs"
