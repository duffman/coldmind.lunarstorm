[package]
name = "devtools-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "lunarstorm serve, bundle, preview and transpile: frontend development server, production bundles, preview and standalone transpilation"
# The frontend tools as a package of the `lunarstorm` command line (`serve`, `bundle`,
# `preview`, `transpile`), mounted by apps/lunarstorm behind its `frontend` feature.
#
# Decision: the former `jetbunny` binary (and the root crate of the old toolchain
# workspace that built it) did not survive the monorepo merge; the crate was left
# library-only and its end-to-end tests could not compile. Its commands now live on
# `lunarstorm`, and those tests run against that binary in apps/lunarstorm/tests.
[lib]
name = "devtools_cli"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
lunarstorm-cli-contract = { path = "../../../crates/cli-contract" }
devtools_core.workspace = true
devtools_server.workspace = true
devtools_bundler.workspace = true
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "net", "signal"] }
