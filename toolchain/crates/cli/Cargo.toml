[package]
name = "devermind-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "jetbunny --serve, --build, --preview and --transpile: development server, production build, preview, and standalone transpilation"
# tests/ run against the jetbunny binary as targets of the root crate.
autotests = false

[lib]
name = "devermind_cli"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
devermind_core.workspace = true
devermind_server.workspace = true
devermind_bundler.workspace = true
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "net", "signal"] }
