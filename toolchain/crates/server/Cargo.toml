[package]
name = "devermind_server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "devermind dev server: on-demand compile over HTTP, module graph, WebSocket HMR, file watcher"

[dependencies]
devermind_core.workspace = true
oj_compiler.workspace = true
oj_graph.workspace = true
oj_resolver.workspace = true
anyhow.workspace = true
serde_json.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53.1", features = ["full"] }
notify = "8.2.0"

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite = "0.29"
futures-util = "0.3"
